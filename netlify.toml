[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Long-term caching for fingerprinted assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- SITE PAUSED -------------------------------------------------------------
# Every address returns a plain "404 Not Found" page (public/paused.html) with no
# site content. To bring the site back: delete this block, then push to `test` and `main`.
[[redirects]]
  from = "/*"
  to = "/paused.html"
  status = 404
  force = true
# ---------------------------------------------------------------------------

# Send www to the apex domain
[[redirects]]
  from = "https://www.everlovehomecarellc.com/*"
  to = "https://everlovehomecarellc.com/:splat"
  status = 301
  force = true
